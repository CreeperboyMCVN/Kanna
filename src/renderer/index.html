<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self'">
  <title>Kanna</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="scrim" class="scrim hidden"></div>

  <aside id="drawer" class="drawer">
    <div class="drawer-head">
      <h2>Settings</h2>
      <button id="btn-close" class="icon-btn" type="button" aria-label="Close settings">✕</button>
    </div>
    <form id="settings-form" autocomplete="off">
      <label class="field">
        <span>AI provider</span>
        <select id="provider">
          <option value="openai">OpenAI</option>
          <option value="anthropic">Anthropic (Claude)</option>
          <option value="gemini">Google (Gemini)</option>
          <option value="custom">OpenAI-compatible (custom)</option>
        </select>
        <p class="hint" id="provider-hint"></p>
      </label>

      <label class="field" id="field-key">
        <span>API key</span>
        <span class="key-row">
          <input id="apikey" type="password" spellcheck="false" placeholder="sk-…">
          <button id="btn-eye" class="icon-btn" type="button" aria-label="Show or hide key">👁</button>
        </span>
      </label>

      <label class="field" id="field-baseurl" hidden>
        <span>Base URL</span>
        <input id="baseurl" type="text" spellcheck="false" placeholder="https://api.example.com/v1">
      </label>

      <label class="field">
        <span>Model</span>
        <input id="model" type="text" spellcheck="false" placeholder="gpt-4o-mini">
      </label>

      <label class="field">
        <span>Persona (system prompt)</span>
        <textarea id="persona" rows="4" spellcheck="false"></textarea>
      </label>

      <div class="field">
        <span>Memory</span>
        <div id="memory-list" class="memory-list"></div>
        <button type="button" id="btn-forget" class="ghost-btn">Forget everything</button>
        <p class="hint">Durable facts Kanna keeps on her own (never secrets like passwords or keys). Saved instantly — the Save button is only for provider settings.</p>
      </div>

      <button type="submit" class="primary">Save</button>
      <p class="note">Keys are stored on this device in the app data folder.</p>
    </form>
  </aside>

  <div id="app">
    <header>
      <span class="brand"><span class="brand-fox">🦊</span><span class="brand-name">Kanna</span></span>
      <span class="spacer"></span>
      <span id="status" class="status" title="Checking configuration…"></span>
      <button id="btn-settings" class="icon-btn" type="button" aria-label="Settings" title="Settings">⚙</button>
      <div class="win-controls" role="group" aria-label="Window controls">
        <button id="win-min" class="win-btn" type="button" title="Minimize">−</button>
        <button id="win-close" class="win-btn close" type="button" title="Close">✕</button>
      </div>
    </header>

    <section class="stage">
      <img id="sprite" class="sprite" src="../../assets/emotes/neutral.png" alt="Kanna" draggable="false">
    </section>

    <section class="chat">
      <div id="messages" class="messages"></div>
      <form id="composer" class="composer">
        <textarea id="input" rows="1" placeholder="Say something…"></textarea>
        <button id="send" type="submit" aria-label="Send" title="Send (Enter)"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
      </form>
    </section>
  </div>

  <div id="toast" class="toast"></div>

  <script src="settings.js" defer></script>
  <script src="renderer.js" defer></script>
</body>
</html>
